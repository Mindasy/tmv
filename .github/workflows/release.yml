name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: ubuntu-24.04-arm
          - arch: x86_64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set package version from tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            python3 tools/release/set-version.py "$GITHUB_REF_NAME"
          fi
          test "$(uname -m)" = '${{ matrix.arch }}'
      - name: Build and test in openEuler 24.03
        shell: bash
        run: |
          docker pull openeuler/openeuler:24.03-lts
          docker run --rm --cap-add=SYS_PTRACE --security-opt seccomp=unconfined \
            -v "$PWD:/src" -w /src openeuler/openeuler:24.03-lts bash -lc '
              set -euo pipefail
              sed -i "s|http://repo.openeuler.org|https://repo.openeuler.org|g" /etc/yum.repos.d/*.repo
              dnf --disablerepo="*" --enablerepo=OS,update install -y rust cargo gcc glibc-devel make rpm-build cpio python3 binutils git
              bash tools/release/build-openeuler.sh
              bash tools/release/verify-openeuler.sh 2>&1 | tee dist/$(uname -m)/acceptance.log
            '
          docker image inspect openeuler/openeuler:24.03-lts --format '{{json .RepoDigests}}' \
            > dist/${{ matrix.arch }}/CONTAINER-IMAGE.txt
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles(format('dist/{0}/**', matrix.arch)) != ''
        with:
          name: openeuler-24.03-${{ matrix.arch }}
          path: dist/${{ matrix.arch }}/
          if-no-files-found: error

  publish:
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Check both acceptance results and assemble release
        shell: bash
        run: |
          mkdir release
          for arch in aarch64 x86_64; do
            dir="artifacts/openeuler-24.03-$arch"
            grep -q "PASS openEuler 24.03 $arch:" "$dir/ACCEPTANCE.txt"
            cmp "$dir/SHA256SUMS" "$dir/ACCEPTED-SHA256SUMS"
            (cd "$dir"; sha256sum -c SHA256SUMS)
            cp "$dir"/*."$arch".rpm "$dir"/tmv-*-openEuler-*.tar.gz release/
            cp "$dir/CONTAINER-IMAGE.txt" "release/CONTAINER-IMAGE-$arch.txt"
            cp "$dir/BUILD-INFO.txt" "release/BUILD-INFO-$arch.txt"
            cp "$dir/ACCEPTANCE.txt" "release/ACCEPTANCE-$arch.txt"
            cp "$dir/acceptance.log" "release/acceptance-$arch.log"
          done
          cp artifacts/openeuler-24.03-aarch64/*.src.rpm release/
          cp artifacts/openeuler-24.03-aarch64/tmv-*-vendor.tar.gz release/
          cp artifacts/openeuler-24.03-aarch64/tmv-[0-9]*.[0-9]*.[0-9]*.tar.gz release/
          cp artifacts/openeuler-24.03-aarch64/RELEASE-NOTES.md release/
          (cd release; sha256sum *.rpm *.tar.gz > SHA256SUMS)
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: release/*
          body_path: release/RELEASE-NOTES.md
