name: Release

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: [tools/release/Dockerfile, tools/release/prepare-deps.sh, Cargo.lock, .github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: ubuntu-24.04-arm
          - arch: x86_64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Restore openEuler toolchain image
        id: builder
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/builder.tar
          key: builder-v1-${{ matrix.arch }}-${{ hashFiles('tools/release/Dockerfile', 'tools/release/prepare-deps.sh') }}
      - name: Prepare toolchain image
        run: |
          if [[ -f "$RUNNER_TEMP/builder.tar" ]]; then
            docker load -i "$RUNNER_TEMP/builder.tar"
          else
            docker build -t tmv-builder -f tools/release/Dockerfile tools/release
            docker save -o "$RUNNER_TEMP/builder.tar" tmv-builder
          fi
      - uses: actions/cache/save@v4
        if: steps.builder.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/builder.tar
          key: ${{ steps.builder.outputs.cache-primary-key }}
      - name: Restore Cargo vendor archive
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/tmv-cache/vendor.tar.gz
          key: tmv-vendor-v1-${{ hashFiles('Cargo.lock') }}
      - name: Restore compiled dependencies
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/tmv-cache/target
          key: tmv-target-v1-${{ matrix.arch }}-${{ steps.builder.outputs.cache-primary-key }}-${{ hashFiles('Cargo.lock', 'tmv.spec', 'Cargo.toml', 'crates/*/Cargo.toml') }}
      - name: Start builder and prepare vendor archive
        run: |
          mkdir -p "$RUNNER_TEMP/tmv-cache/target" "dist/${{ matrix.arch }}"
          docker run -d --name tmv-build --cap-add=SYS_PTRACE --security-opt seccomp=unconfined \
            -v "$PWD:/src" -w /src -v "$RUNNER_TEMP/tmv-cache:/cache" \
            -e TMV_RPM_WORKDIR=/var/tmp/tmv-package -e TMV_VENDOR_ARCHIVE=/cache/vendor.tar.gz -e CARGO_TARGET_DIR=/cache/target \
            tmv-builder sleep infinity
          docker image inspect tmv-builder --format '{{.Id}}' > dist/${{ matrix.arch }}/CONTAINER-IMAGE.txt
          if [[ ! -f "$RUNNER_TEMP/tmv-cache/vendor.tar.gz" ]]; then
            docker exec tmv-build bash -ec 'cargo vendor --locked /tmp/vendor && tar czf /cache/vendor.tar.gz -C /tmp vendor'
          fi
      - name: Set package version from tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            python3 tools/release/set-version.py "$GITHUB_REF_NAME"
          fi
          test "$(uname -m)" = '${{ matrix.arch }}'
      - name: Build RPM and portable archive
        timeout-minutes: 20
        run: docker exec tmv-build bash tools/release/build-openeuler.sh
      - name: Verify installed RPM and portable archive
        timeout-minutes: 6
        shell: bash
        run: |
          set -o pipefail
          docker exec tmv-build bash tools/release/verify-openeuler.sh 2>&1 | tee dist/${{ matrix.arch }}/acceptance.log
      - name: Collect dependency logs and remove container
        if: always()
        timeout-minutes: 2
        shell: bash
        run: |
          if docker container inspect tmv-build >/dev/null 2>&1; then
            mkdir -p "dist/${{ matrix.arch }}/dependency-logs"
            docker cp tmv-build:/var/log/dnf.log "dist/${{ matrix.arch }}/dependency-logs/" || true
            docker cp tmv-build:/var/log/dnf.librepo.log "dist/${{ matrix.arch }}/dependency-logs/" || true
            docker exec tmv-build chown -R "$(id -u):$(id -g)" /cache
            docker rm -f tmv-build
          fi
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles(format('dist/{0}/**', matrix.arch)) != ''
        with:
          name: openeuler-24.03-${{ matrix.arch }}
          path: dist/${{ matrix.arch }}/
          if-no-files-found: error

  publish:
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Check both acceptance results and assemble release
        shell: bash
        run: |
          mkdir release
          for arch in aarch64 x86_64; do
            dir="artifacts/openeuler-24.03-$arch"
            grep -q "PASS openEuler 24.03 $arch:" "$dir/ACCEPTANCE.txt"
            cmp "$dir/SHA256SUMS" "$dir/ACCEPTED-SHA256SUMS"
            (cd "$dir"; sha256sum -c SHA256SUMS)
            cp "$dir"/*."$arch".rpm "$dir"/tmv-*-openEuler-*.tar.gz release/
            cp "$dir/CONTAINER-IMAGE.txt" "release/CONTAINER-IMAGE-$arch.txt"
            cp "$dir/BUILD-INFO.txt" "release/BUILD-INFO-$arch.txt"
            cp "$dir/ACCEPTANCE.txt" "release/ACCEPTANCE-$arch.txt"
            cp "$dir/acceptance.log" "release/acceptance-$arch.log"
          done
          cp artifacts/openeuler-24.03-aarch64/*.src.rpm release/
          cp artifacts/openeuler-24.03-aarch64/tmv-*-vendor.tar.gz release/
          cp artifacts/openeuler-24.03-aarch64/tmv-[0-9]*.[0-9]*.[0-9]*.tar.gz release/
          cp artifacts/openeuler-24.03-aarch64/RELEASE-NOTES.md release/
          (cd release; sha256sum *.rpm *.tar.gz > SHA256SUMS)
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: release/*
          body_path: release/RELEASE-NOTES.md
