name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: ubuntu-24.04-arm
          - arch: x86_64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set package version from tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            python3 tools/release/set-version.py "$GITHUB_REF_NAME"
          fi
          test "$(uname -m)" = '${{ matrix.arch }}'
      - name: Restore DNF download cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/tmv-dnf-cache
          key: oe2403-dnf-${{ matrix.arch }}-${{ hashFiles('tmv.spec', 'tools/release/prepare-deps.sh') }}
          restore-keys: |
            oe2403-dnf-${{ matrix.arch }}-
      - name: Pull and start openEuler container
        timeout-minutes: 5
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/tmv-dnf-cache" "dist/${{ matrix.arch }}"
          docker pull openeuler/openeuler:24.03-lts
          docker run -d --name tmv-build --cap-add=SYS_PTRACE --security-opt seccomp=unconfined \
            -v "$PWD:/src" -w /src \
            -v "$RUNNER_TEMP/tmv-dnf-cache:/var/cache/dnf" \
            openeuler/openeuler:24.03-lts sleep infinity
          docker exec tmv-build bash -lc 'sed -i "s|http://repo.openeuler.org|https://repo.openeuler.org|g" /etc/yum.repos.d/*.repo'
          docker image inspect openeuler/openeuler:24.03-lts --format '{{json .RepoDigests}}' \
            > dist/${{ matrix.arch }}/CONTAINER-IMAGE.txt
      - name: Download OS repository metadata
        timeout-minutes: 4
        run: docker exec tmv-build bash tools/release/prepare-deps.sh os
      - name: Download update repository metadata
        timeout-minutes: 8
        run: docker exec tmv-build bash tools/release/prepare-deps.sh update
      - name: Install build and test dependencies
        timeout-minutes: 10
        run: docker exec tmv-build bash tools/release/prepare-deps.sh install
      - name: Build RPM and portable archive
        timeout-minutes: 20
        run: docker exec tmv-build bash tools/release/build-openeuler.sh
      - name: Verify installed RPM and portable archive
        timeout-minutes: 6
        shell: bash
        run: |
          set -o pipefail
          docker exec tmv-build bash tools/release/verify-openeuler.sh 2>&1 | tee dist/${{ matrix.arch }}/acceptance.log
      - name: Collect dependency logs and remove container
        if: always()
        timeout-minutes: 2
        shell: bash
        run: |
          if docker container inspect tmv-build >/dev/null 2>&1; then
            mkdir -p "dist/${{ matrix.arch }}/dependency-logs"
            docker cp tmv-build:/var/log/dnf.log "dist/${{ matrix.arch }}/dependency-logs/" || true
            docker cp tmv-build:/var/log/dnf.librepo.log "dist/${{ matrix.arch }}/dependency-logs/" || true
            docker rm -f tmv-build
          fi
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles(format('dist/{0}/**', matrix.arch)) != ''
        with:
          name: openeuler-24.03-${{ matrix.arch }}
          path: dist/${{ matrix.arch }}/
          if-no-files-found: error

  publish:
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Check both acceptance results and assemble release
        shell: bash
        run: |
          mkdir release
          for arch in aarch64 x86_64; do
            dir="artifacts/openeuler-24.03-$arch"
            grep -q "PASS openEuler 24.03 $arch:" "$dir/ACCEPTANCE.txt"
            cmp "$dir/SHA256SUMS" "$dir/ACCEPTED-SHA256SUMS"
            (cd "$dir"; sha256sum -c SHA256SUMS)
            cp "$dir"/*."$arch".rpm "$dir"/tmv-*-openEuler-*.tar.gz release/
            cp "$dir/CONTAINER-IMAGE.txt" "release/CONTAINER-IMAGE-$arch.txt"
            cp "$dir/BUILD-INFO.txt" "release/BUILD-INFO-$arch.txt"
            cp "$dir/ACCEPTANCE.txt" "release/ACCEPTANCE-$arch.txt"
            cp "$dir/acceptance.log" "release/acceptance-$arch.log"
          done
          cp artifacts/openeuler-24.03-aarch64/*.src.rpm release/
          cp artifacts/openeuler-24.03-aarch64/tmv-*-vendor.tar.gz release/
          cp artifacts/openeuler-24.03-aarch64/tmv-[0-9]*.[0-9]*.[0-9]*.tar.gz release/
          cp artifacts/openeuler-24.03-aarch64/RELEASE-NOTES.md release/
          (cd release; sha256sum *.rpm *.tar.gz > SHA256SUMS)
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: release/*
          body_path: release/RELEASE-NOTES.md
