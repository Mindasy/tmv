name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # 手动触发没有 tag，用 dev 作为产物名后缀。
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}

jobs:
  # 生成 RPM 用的源码包与 vendor 依赖包，供 tmv.spec 的 Source0 / Source1 使用。
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: 打源码包与 vendor 包
        run: |
          version="${RELEASE_TAG#v}"
          mkdir -p dist
          cargo vendor vendor >/dev/null
          tar --transform "s,^,tmv-${version}/," \
              --exclude target --exclude .git --exclude '._*' \
              -czf "dist/tmv-${version}.tar.gz" \
              Cargo.toml Cargo.lock README.md LICENSE clippy.toml tmv.spec tmv.1 crates
          tar -czf "dist/tmv-${version}-vendor.tar.gz" vendor
          sha256sum dist/*.tar.gz > dist/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: sources
          path: dist/*

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
          generate_release_notes: true

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-linux-musl
          - x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # cross 自带各架构的 musl 工具链镜像，避免手动配交叉链接器。
      - uses: taiki-e/install-action@v2
        with:
          tool: cross

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: 构建静态二进制
        run: cross build --release --locked --target ${{ matrix.target }}

      - name: 打包
        run: |
          pkg="tmv-${RELEASE_TAG}-${{ matrix.target }}"
          mkdir -p "dist/${pkg}"
          cp "target/${{ matrix.target }}/release/tmv" "dist/${pkg}/"
          cp README.md LICENSE "dist/${pkg}/"
          tar -czf "dist/${pkg}.tar.gz" -C dist "${pkg}"
          rm -rf "dist/${pkg}"
          sha256sum "dist/${pkg}.tar.gz" > "dist/${pkg}.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
